<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Converter Menu</title>
  <link rel="icon" href="/Assets/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --border: #30363d;
      --accent: #22d3ee;
      --accent-2: #60a5fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      width: min(1040px, 100%);
    }

    .header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .header h1 {
      font-size: 2rem;
      letter-spacing: -0.03em;
      margin-bottom: 0.3rem;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .footer-actions {
      margin-top: 1rem;
      display: flex;
      justify-content: center;
    }

    .settings-link {
      text-decoration: none;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.8rem;
      padding: 0.45rem 0.8rem;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .settings-link:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .menu-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.4rem;
      min-height: 260px;
      text-decoration: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      color: var(--text);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      padding: 1.25rem;
    }

    .menu-btn:hover {
      transform: translateY(-3px);
    }

    .menu-btn.direct:hover {
      border-color: var(--accent);
      box-shadow: 0 10px 24px rgba(34, 211, 238, 0.16);
    }

    .menu-btn.sheet:hover {
      border-color: var(--accent-2);
      box-shadow: 0 10px 24px rgba(96, 165, 250, 0.16);
    }

    .menu-btn.old-to-new:hover {
      border-color: #a78bfa;
      box-shadow: 0 10px 24px rgba(167, 139, 250, 0.16);
    }

    .menu-title {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .menu-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: center;
      max-width: 280px;
      line-height: 1.45;
    }

    @media (max-width: 700px) {
      .menu-grid {
        grid-template-columns: 1fr;
      }

      .menu-btn {
        min-height: 180px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <a href="/" class="back-btn" style="display:inline-flex; align-items:center; gap:0.5rem; text-decoration:none; color:var(--text-muted); margin-bottom:1.5rem; font-size: 0.95rem; font-weight: 500; transition: color 0.2s ease;" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text-muted)'">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      Kembali ke Dashboard
    </a>
    <header class="header">
      <h1>Pilih Converter</h1>
      <p>Pilih mode yang ingin digunakan</p>
    </header>

    <section class="menu-grid">
      <a class="menu-btn direct" href="/converter/direct-converter">
        <span class="menu-title">Direct Converter</span>
        <span class="menu-desc">Langsung Convert harga untuk 1 item</span>
      </a>

      <a class="menu-btn sheet" href="/converter/sheet-style-converter">
        <span class="menu-title">Sheet Style Converter</span>
        <span class="menu-desc">Dalam bentuk sheets untuk cek banyak item</span>
      </a>

      <a class="menu-btn old-to-new" href="/converter/old-to-new-price-converter">
        <span class="menu-title">Old to New Price</span>
        <span class="menu-desc">Convert harga dari fee lama ke harga fee baru</span>
      </a>
    </section>

    <div class="footer-actions">
      <a class="settings-link" href="/converter/fee-auth">atur fee kategori</a>
    </div>
  </main>
</body>
</html>
