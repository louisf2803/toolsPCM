<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penghitung DPP</title>
  <meta name="description" content="Kalkulator Harga Tayang dan Dasar Pengenaan Pajak (DPP)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f14;
      --card-bg: rgba(26, 35, 50, 0.4);
      --card-border: rgba(255, 255, 255, 0.06);
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #22d3ee;
      --accent-glow: rgba(34, 211, 238, 0.5);
      --accent-2: #818cf8;
      --success: #34d399;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 0% 0%, rgba(34, 211, 238, 0.08), transparent 40%),
        radial-gradient(circle at 100% 100%, rgba(129, 140, 248, 0.08), transparent 40%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    /* Animated background blobs */
    .blob {
      position: absolute;
      filter: blur(80px);
      z-index: -1;
      opacity: 0.3;
      border-radius: 50%;
      animation: float 10s infinite alternate ease-in-out;
    }
    .blob-1 { top: -10%; left: -10%; width: 400px; height: 400px; background: rgba(34, 211, 238, 0.15); }
    .blob-2 { bottom: -10%; right: -10%; width: 350px; height: 350px; background: rgba(129, 140, 248, 0.15); animation-delay: -5s; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(20px, 30px) scale(1.1); }
    }

    .back-btn {
      align-self: flex-start;
      margin-left: max(1rem, calc(50% - 300px));
      margin-bottom: 2rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 500;
      transition: color 0.3s ease, transform 0.3s ease;
      z-index: 10;
    }

    .back-btn:hover {
      color: var(--text);
      transform: translateX(-4px);
    }

    .container {
      width: 100%;
      max-width: 600px;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
      z-index: 10;
    }

    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .title {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .calculator-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 20px rgba(34, 211, 238, 0.05);
      position: relative;
      overflow: hidden;
    }

    .calculator-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    .input-group {
      margin-bottom: 1.5rem;
    }

    .input-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: #cbd5e1;
      font-size: 0.95rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .prefix {
      position: absolute;
      left: 1rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .input-field {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1rem 1rem 1rem 3rem;
      color: var(--text);
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 600;
      transition: all 0.3s ease;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.1);
      background: rgba(15, 23, 42, 0.8);
    }

    .results-section {
      margin-top: 2.5rem;
      padding-top: 2rem;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
      display: grid;
      gap: 1.25rem;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 1.5rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.3s ease, background 0.3s ease;
    }

    .result-item:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.05);
    }

    .result-item.highlight {
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.1), rgba(129, 140, 248, 0.1));
      border-color: rgba(34, 211, 238, 0.2);
    }

    .result-item.highlight:hover {
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.15), rgba(129, 140, 248, 0.15));
    }

    .result-label {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .result-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }

    .highlight .result-value {
      background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 1.5rem;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-left: 1rem;
    }
    
    .copy-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      transform: translateY(-2px);
    }

    @media (max-width: 640px) {
      .calculator-card { padding: 1.5rem; }
      .result-item { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
      .back-btn { margin-left: 1rem; }
    }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <a href="/" class="back-btn">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
    </svg>
    Kembali ke Dashboard
  </a>

  <main class="container">
    <header class="header">
      <h1 class="title">Penghitung DPP</h1>
      <p class="subtitle">Kalkulasi Harga Tayang dan Dasar Pengenaan Pajak</p>
    </header>

    <div class="calculator-card">
      <div class="input-group">
        <label for="harga-awal">Harga Sebelum Diskon</label>
        <div class="input-wrapper">
          <span class="prefix">Rp</span>
          <input type="text" id="harga-awal" class="input-field" placeholder="0" inputmode="numeric">
        </div>
      </div>

      <div class="input-group">
        <label for="diskon">Diskon Penjual</label>
        <div class="input-wrapper">
          <span class="prefix">Rp</span>
          <input type="text" id="diskon" class="input-field" placeholder="0" inputmode="numeric">
        </div>
      </div>

      <div class="results-section">
        <div class="result-item">
          <span class="result-label">Harga Tayang</span>
          <span class="result-value" id="harga-tayang">Rp 0</span>
        </div>
        <div class="result-item highlight">
          <span class="result-label">DPP</span>
          <div style="display: flex; align-items: center;">
            <span class="result-value" id="dpp">Rp 0</span>
            <button id="copy-btn" class="copy-btn" title="Copy format program">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Format number to IDR string
    const formatRupiah = (number) => {
      if (isNaN(number)) return '0';
      return new Intl.NumberFormat('id-ID').format(Math.round(number));
    };

    // Format number to IDR string with specific decimals
    const formatRupiahDecimal = (number, decimals = 3) => {
      if (isNaN(number)) return '0';
      return new Intl.NumberFormat('id-ID', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      }).format(number);
    };

    // Parse IDR string to number
    const parseRupiah = (formattedStr) => {
      const parsed = parseFloat(formattedStr.replace(/[^0-9]/g, ''));
      return isNaN(parsed) ? 0 : parsed;
    };

    const inputHargaAwal = document.getElementById('harga-awal');
    const inputDiskon = document.getElementById('diskon');
    const outHargaTayang = document.getElementById('harga-tayang');
    const outDpp = document.getElementById('dpp');
    const copyBtn = document.getElementById('copy-btn');
    
    let currentDpp = 0;

    const updateCalculations = () => {
      const hargaAwal = parseRupiah(inputHargaAwal.value);
      const diskon = parseRupiah(inputDiskon.value);

      // Calculate Harga Tayang (Harga Sebelum Diskon - Diskon Penjual)
      const hargaTayang = Math.max(0, hargaAwal - diskon);
      
      // Calculate DPP (Harga Tayang / 1.11)
      const dpp = hargaTayang / 1.11;
      currentDpp = dpp;

      // Update UI
      outHargaTayang.textContent = `Rp ${formatRupiah(hargaTayang)}`;
      outDpp.textContent = `Rp ${formatRupiahDecimal(dpp, 3)}`;
    };

    const handleInputFormat = (e) => {
      const rawValue = parseRupiah(e.target.value);
      if (rawValue === 0 && e.target.value === '') {
        e.target.value = '';
      } else {
        e.target.value = formatRupiah(rawValue);
      }
      updateCalculations();
    };

    // Prevent non-numeric key presses
    const allowOnlyNumbers = (e) => {
      const key = e.key;
      // Allow navigation keys, backspace, delete, etc.
      if (['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(key)) return;
      // Prevent non-number keys
      if (!/[0-9]/.test(key)) {
        e.preventDefault();
      }
    };

    inputHargaAwal.addEventListener('keydown', allowOnlyNumbers);
    inputHargaAwal.addEventListener('input', handleInputFormat);
    
    inputDiskon.addEventListener('keydown', allowOnlyNumbers);
    inputDiskon.addEventListener('input', handleInputFormat);

    // Copy format to clipboard
    copyBtn.addEventListener('click', () => {
      const copyText = currentDpp.toFixed(3);
      navigator.clipboard.writeText(copyText).then(() => {
        const originalHtml = copyBtn.innerHTML;
        copyBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>`;
        copyBtn.style.color = 'var(--success)';
        copyBtn.style.borderColor = 'var(--success)';
        setTimeout(() => {
          copyBtn.innerHTML = originalHtml;
          copyBtn.style.color = '';
          copyBtn.style.borderColor = '';
        }, 1500);
      }).catch(err => {
        console.error('Failed to copy: ', err);
      });
    });
  </script>
</body>
</html>
